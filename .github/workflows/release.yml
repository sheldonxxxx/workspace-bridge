name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub Release tag to rebuild/republish (e.g. v0.1.1). Must already exist and not be a draft. No tags or releases are created, moved, or deleted.'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release tag and versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Manual recovery must target an existing non-draft Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          test -n "$TAG"
          echo "Manual recovery for existing Release: $TAG (no tags or releases will be created, moved, or deleted)"
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          test "$IS_DRAFT" = "false" || { echo "Release $TAG is missing or is a draft; refusing manual recovery" >&2; exit 1; }
          echo "Release $TAG exists and is not a draft"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Tag must be exactly v<project-version>
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          test -n "$TAG"
          case "$TAG" in
            v*) ;;
            *) echo "tag must start with v" >&2; exit 1;;
          esac
          VERSION="${TAG#v}"
          echo "Release tag: $TAG (version $VERSION)"
          # pyproject version must match tag version exactly.
          PY_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$PY_VERSION" = "$VERSION" || { echo "pyproject $PY_VERSION != tag $VERSION" >&2; exit 1; }
          # Pi package version must match tag.
          PI_VERSION="$(node -p 'require("./runtime/pi-host-adapter/package.json").version')"
          test "$PI_VERSION" = "$VERSION" || { echo "pi $PI_VERSION != tag $VERSION" >&2; exit 1; }
          # workspace-bridge product version must match tag.
          WB_VERSION="$(uv run python -c 'from workspace_bridge import __version__; print(__version__)')"
          test "$WB_VERSION" = "$VERSION" || { echo "product $WB_VERSION != tag $VERSION" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

  quality:
    name: Full CI on release tag
    needs: [validate-release]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  npm-pack:
    name: npm pack / Linux x64
    needs: [validate-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/pi-host-adapter/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix runtime/pi-host-adapter ci
      - name: Test Pi adapter
        run: npm --prefix runtime/pi-host-adapter test
      - name: Pack exact npm tarball (no rebuild on publish)
        run: |
          set -euo pipefail
          rm -rf dist/npm
          mkdir -p dist/npm
          (cd runtime/pi-host-adapter && npm pack --dry-run --json > "$GITHUB_WORKSPACE/dist/npm/dry-run.json")
          (cd runtime/pi-host-adapter && npm pack --pack-destination "$GITHUB_WORKSPACE/dist/npm")
          ls -lh dist/npm
          test "$(ls dist/npm/*.tgz | wc -l)" = "1"
      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm
          if-no-files-found: error
          retention-days: 30

  prepare-pypi-dist:
    name: Prepare PyPI dist (no OIDC)
    needs: [validate-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Build the Manager the wheel ships
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          git diff --exit-code -- workspace_bridge/static/dist
      - name: Build the wheel once
        run: |
          set -euo pipefail
          rm -rf dist/pypi
          uv build --wheel --out-dir dist/pypi
          test "$(ls dist/pypi/*.whl | wc -l)" = "1"
          (cd dist/pypi && sha256sum *.whl | tee wheel.sha256)
      - name: Inspect wheel console entry points
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/pypi/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              eps = [n for n in names if n.endswith("entry_points.txt")]
              assert len(eps) == 1, names
              text = z.read(eps[0]).decode()
          assert "workspace-bridge = workspace_bridge.cli:main" in text, text
          assert "workspace-bridge-node = workspace_bridge.node_cli:main" in text, text
          assert "-adapter = " not in text, text
          for plugin in ("claude", "codex", "opencode", "pi"):
              assert f"workspace_bridge/plugins/{plugin}.toml" in names, names
          assert "workspace_bridge/opencode_permission_plugin/index.mjs" in names
          assert "workspace_bridge/opencode_permission_plugin/package.json" in names
          print("wheel console_scripts ok")
          PY
      - name: Smoke exact staged wheel in a clean environment
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/bridge-wheel-smoke"
          uv venv "$VENV"
          uv pip install --python "$VENV/bin/python" dist/pypi/*.whl
          test "$("$VENV/bin/workspace-bridge" --version)" = "${RELEASE_TAG#v}"
          "$VENV/bin/workspace-bridge" node --help
          "$VENV/bin/workspace-bridge-node" --help
          "$VENV/bin/workspace-bridge-node" plugin --help
          "$VENV/bin/python" -c 'from workspace_bridge.plugin_protocol import builtin_manifests; assert set(builtin_manifests()) == {"claude", "codex", "opencode", "pi"}'
          "$VENV/bin/python" -c 'import workspace_bridge.plugin_host, workspace_bridge.opencode_host_adapter; from importlib.resources import files; assert files("workspace_bridge").joinpath("opencode_permission_plugin/index.mjs").is_file()'
      - name: Upload prepared PyPI dist
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/pypi/*.whl
          if-no-files-found: error
          retention-days: 30

  release-ready:
    name: Release ready barrier
    needs: [validate-release, quality, npm-pack, prepare-pypi-dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: All prerequisites passed
        run: echo release-ready-barrier-passed

  pypi-publish:
    name: Publish Python wheel (OIDC)
    needs: [release-ready, prepare-pypi-dist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/pypi
      - name: Publish exact wheel via Trusted Publishing (no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          verbose: true

  npm-publish:
    name: Publish npm package (OIDC, gated)
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs: [release-ready, npm-pack]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/npm
      - name: Require npm >=11.15.0 for staged publishing
        run: |
          set -euo pipefail
          npm --version
          node -p "const v=require('child_process').execSync('npm --version').toString().trim(); const p=v.split('.').map(Number); if (p[0]<11 || (p[0]===11 && p[1]<15)) { console.error('npm >=11.15.0 required, got '+v); process.exit(1); } else { console.log('npm staged-publish-ready: '+v); }"
      - name: Publish exact tarball (staged by default)
        run: |
          set -euo pipefail
          shopt -s nullglob
          tgzs=(dist/npm/*.tgz)
          test "${#tgzs[@]}" = "1" || { echo "expected exactly one .tgz from pack job" >&2; exit 1; }
          echo "Publishing exact artifact: ${tgzs[0]} (no rebuild)"
          # Private repos cannot satisfy provenance; never require it.
          # Default is staged publish for initial safety; direct only via
          # repository variable NPM_PUBLISH_MODE=direct.
          if [ "${{ vars.NPM_PUBLISH_MODE }}" = "direct" ]; then
            npm publish "${tgzs[0]}" --access public --provenance=false
          else
            npm stage publish "${tgzs[0]}" --access public
          fi

  release-assets:
    name: Upload GitHub Release assets
    needs: [release-ready, npm-pack, prepare-pypi-dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/pypi
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/npm
      - name: Stage versioned release assets
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          rm -rf dist/release-assets
          mkdir -p dist/release-assets
          cp "dist/pypi/workspace_bridge-${VERSION}-py3-none-any.whl" dist/release-assets/
          cp dist/npm/*.tgz dist/release-assets/
          (cd dist/release-assets && sha256sum * > "workspace-bridge-${VERSION}.sha256")
          ls -lh dist/release-assets
      - name: Upload to already-published Release (no new tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          gh release upload "$TAG" dist/release-assets/* --clobber
