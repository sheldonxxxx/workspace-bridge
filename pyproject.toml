[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-bridge"
version = "0.2.0"
description = "Plan in ChatGPT, build with your local agents: a safe MCP bridge to your workspace and Claude Code, Codex, or Pi"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Workspace Bridge contributors" }]
keywords = ["mcp", "model-context-protocol", "chatgpt", "claude-code", "codex", "ai-agents", "coding-agent", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["starlette>=0.50,<1", "uvicorn>=0.35,<1", "pydantic>=2.12,<3", "regex>=2025.7.34,<2027", "Pillow>=12.3,<13"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/sheldonxxxx/workspace-bridge"
Documentation = "https://github.com/sheldonxxxx/workspace-bridge/blob/main/docs/README.md"
Changelog = "https://github.com/sheldonxxxx/workspace-bridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/sheldonxxxx/workspace-bridge/issues"

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2.163,<0.3"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
workspace-bridge = "workspace_bridge.cli:main"
workspace-bridge-node = "workspace_bridge.node_cli:main"
workspace-bridge-codex-adapter = "workspace_bridge.codex_host_adapter:main"
workspace-bridge-claude-adapter = "workspace_bridge.claude_host_adapter:main"

[tool.setuptools.packages.find]
include = ["workspace_bridge*"]

[tool.setuptools.package-data]
workspace_bridge = ["static/dist/*", "static/dist/assets/*", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
